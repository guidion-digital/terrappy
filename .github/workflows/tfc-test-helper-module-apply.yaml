on:
  workflow_call:
    inputs:
      environment_name:
        description: The Github environment to deploy to.
        type: string
        # TODO: Rename these environments to ministack
        default: "localstack"
    outputs:
      terraform-file-changes-result:
        description: "Output from terraform-file-changes GH Actions"
        value: ${{ jobs.terraform-file-changes.outputs.result }}
      ministack-apply-result:
        description: "Result of the MiniStack apply job ('success', 'failure', 'skipped' or 'cancelled')"
        value: ${{ jobs.completed.outputs.ministack-apply-result }}
      # DEPRECATED: Use ministack-apply-result. Kept so that callers written for the LocalStack
      # version of this workflow keep gating their releases correctly
      local-stack-apply-result:
        description: "DEPRECATED: Use ministack-apply-result"
        value: ${{ jobs.completed.outputs.ministack-apply-result }}
      # DEPRECATED: Use ministack-apply-result. Briefly published under this name in v3
      mini-stack-apply-result:
        description: "DEPRECATED: Use ministack-apply-result"
        value: ${{ jobs.completed.outputs.ministack-apply-result }}

jobs:
  terraform-file-changes:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.terraform-file-changes.outputs.terraform }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: terraform-file-changes
        with:
          filters: |
            terraform:
              - '**/*.tf'

  get-matrix-directories:
    needs: terraform-file-changes
    if: ${{ needs.terraform-file-changes.outputs.result == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: set-matrix
        working-directory: ./examples
        run: echo "matrix=$(find -- * -type d | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  ministack-apply:
    needs: get-matrix-directories
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    services:
      # Fake AWS Cloud. The runner waits for the image's built-in healthcheck before running steps
      ministack:
        image: ministackorg/ministack:1.5.31
        ports:
          - 4566:4566
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: eu-central-1
    strategy:
      matrix:
        folders: ${{ fromJson(needs.get-matrix-directories.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Test API
        working-directory: ./examples
        run: |
          cd "${{ matrix.folders }}"
          terraform init
          terraform apply -input=false -auto-approve

  # This is needed because matrix tests have dynamic workflow names based on the folder name. This is something we cannot make a required test from.
  # Because skipped tests are marked as succesfull in GitHub required test, we test here if it was succesfully run and then mark it as such, if it's skipped or fails then it's marked as failed.
  completed:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs: [terraform-file-changes, ministack-apply]
    outputs:
      ministack-apply-result: ${{ needs.ministack-apply.result }}
    steps:
      - id: workflow-or-terraform-change
        if: ${{ (needs.terraform-file-changes.outputs.result == 'false')  || (needs.ministack-apply.result  == 'success') }}
        run: exit 0
      - if: failure() || steps.workflow-or-terraform-change.outcome != 'success'
        run: exit 1
