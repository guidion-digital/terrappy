on:
  workflow_call:
    secrets:
      tfc_planner_api_token:
        description: Token used to retreieve private modules from Terraform Cloud
        required: false
  
jobs:
  reviewdog-tf-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-terraform-validate@v1
        with:
          # Push runs have no pull request; report their findings as annotations.
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-annotations' }}
          terraform_version: 1.6.1
          terraform_cloud_token: ${{ secrets.tfc_planner_api_token }}
